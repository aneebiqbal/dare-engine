[package]
name = "clipdesk-missions"
version = "0.1.0"
description = "Clipdesk Missions — the admin's local clip engine"
edition = "2021"

[lib]
name = "clipdesk_missions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
