name: clipdesk

# One server, one command. Dev defaults are inline so `docker compose up` works
# with no .env; production must override every secret.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipdesk}
      POSTGRES_DB: ${POSTGRES_DB:-clipdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage:
    # S3Mock stands in for S3. MinIO's OSS server is archived and its registry is
    # unreachable here; see docs/decisions.md. Swap this block for real S3 later.
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-clipdesk}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - s3mockdata:/s3mockroot
    ports:
      # Host port 9100 avoids other local services; the container port is 9090.
      - "9100:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://clipdesk:clipdesk@db:5432/clipdesk}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_BUCKET: ${S3_BUCKET:-clipdesk}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-clipdesk}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-clipdesk-dev-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      LLM_PROVIDER: ${LLM_PROVIDER:-recorded}
      LLM_RECORDED_RESPONSE: ${LLM_RECORDED_RESPONSE:-/app/app/llm_recorded.json}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz/ready", timeout=3).status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://clipdesk:clipdesk@db:5432/clipdesk}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_BUCKET: ${S3_BUCKET:-clipdesk}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-clipdesk}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-clipdesk-dev-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=3).status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_URL: ${API_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Next binds to HOSTNAME; Docker sets it to the container id, which breaks
      # the in-container health probe. Bind all interfaces instead.
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3100:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3000/api/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  relay:
    build: ./relay
    volumes:
      - ./relay/mediamtx.yml:/mediamtx.yml:ro
      - relayrecordings:/recordings
    ports:
      - "1935:1935"   # RTMP ingest
      - "8554:8554"   # RTSP
      - "19997:9997"  # control API (host 9997 is an existing SSH tunnel)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  s3mockdata:
  relayrecordings:
