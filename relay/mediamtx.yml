# M4: RTMP ingest with per-stream keys, fMP4 recording and API auth hooks.
rtmpAddress: :1935
rtspAddress: :8554
rtmpEncryption: "no"
rtspEncryption: "no"

api: yes
apiAddress: :9997

authMethod: http
authHTTPAddress: http://api:8000/hooks/relay/auth
# The control API must not be auth'd.
authHTTPExclude:
  - action: api

paths:
  all_others:
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 15s
    recordDeleteAfter: 0s
    runOnRecordSegmentComplete: >-
      /bin/sh -c 'curl -s -X POST http://api:8000/hooks/relay/segment
      -H "Content-Type: application/json"
      -d "{\"path\":\"$MTX_PATH\",\"segment\":\"$MTX_SEGMENT_PATH\",\"duration\":$MTX_SEGMENT_DURATION}"'
